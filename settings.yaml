AEDT_VERSION: "2023.1"
NUM_CORES: 20
path: "C:/Users/24781/Desktop/FSSDataBase/datasets"
samples: 10

unit:
  size: 40
  wire_width: [0.2, 0.6]

materials:
  F4B:
    permittivity: 3.48
    permeability: 1
    dielectric_loss_tangent: 0.0037

  Rogers5880:
    permittivity: 2.2
    permeability: 1
    dielectric_loss_tangent: 0.0009

generators:
  group1:
    weight: 0.3
    max_region: [0.1, 0.4]
    branch:
      switch: True
      content: 4

  group2:
    weight: 0.3
    branch:
      switch: True
      content: 4
    strategy:
      switch: True
      content: 0
    bend:
      switch: True
      content: 2

  group3:
    weight: 0.4
    branch:
      switch: True
      content: 4
    strategy:
      switch: True
      content: 0
    bend:
      switch: True
      content: 2

stackup:
  mode: arrangement   # arrangement 或 random

  random:
    metal_layers: [1, 3]
    dielectric_layers: [1, 3]
    dielectric_candidates: ["F4B", "Rogers5880"]
    dielectric_h: [3,6]
    metal_candidates: ["group1", "group2", "group3"]

  arrangement:
    - type: "dielectric"
      material: "F4B"
      h: 10

    - type: "metal"
      group: ["group2", "group3"]

    - type: "dielectric"
      material: random
      candidates: ["F4B", "Rogers5880"]
      h: [5, 12]

    - type: "metal"
      group: "group3"

frequency:
  - [1,30,50]

angle:
  enabled: False
  detail:
    - [0, 30, 2]